# /etc/turnserver.conf
# Coturn configuration for Vybe WebRTC TURN relay (Hetzner VPS ~€4/mo)

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# External public IP of your VPS (replace with actual IP)
# external-ip=YOUR_HETZNER_VPS_PUBLIC_IP

# Realm for authentication
realm=turn.vybe.live

# Use long-term credential mechanism with shared secret
use-auth-secret
static-auth-secret=CHANGE_THIS_TO_A_STRONG_RANDOM_SECRET

# Stale nonce duration
stale-nonce=600

# Security: disable insecure mechanisms
fingerprint
no-tcp-relay
no-multicast-peers

# Port range for media relay
min-port=49152
max-port=65535

# Verbose logging to systemd
log-file=syslog
simple-log
